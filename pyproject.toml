[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

[tool.coverage.run]
# Measure production code only, so the pytest figure matches SonarQube's.
omit = ["*/test_*.py", "*/tests/*", "*/conftest.py", "*/migrations/*"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations: one column definition per line reads better than wrapped.
"backend/migrations/**" = ["E501"]
