services:
  upskill-db:
    image: postgres:16-alpine
    container_name: upskill-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upskill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-upskill_ai}
    # No published ports: the database is reachable only from other containers
    # on the compose network as upskill-db:5432 (architecture section 4.4).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  upskill-api:
    container_name: upskill-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-upskill}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@upskill-db:5432/${POSTGRES_DB:-upskill_ai}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      upskill-db:
        condition: service_healthy

  upskill-web:
    container_name: upskill-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      upskill-api:
        condition: service_started

volumes:
  pgdata:
    name: pgdata
