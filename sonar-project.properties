sonar.projectKey=upskill-ai
sonar.projectName=UpSkill-AI
sonar.python.version=3.12
# Tests live next to their module inside backend/, so the same tree is both
# sources and tests. Sources exclude test files; tests include only them.
# Without sonar.tests, test files are not analysed at all (neither as source
# nor as tests); with it they are recognised as test code.
sonar.sources=backend
sonar.tests=backend
sonar.test.inclusions=**/test_*.py,**/tests/**
sonar.exclusions=**/test_*.py,**/tests/**,**/__pycache__/**,**/.venv/**,**/node_modules/**,**/.next/**,**/coverage/**
sonar.python.coverage.reportPaths=coverage.xml
