# Jenkins configuration as code for the ephemeral CI server started by
# ci/run-pipeline.sh (locally or in GitHub Actions). Every ${VAR} comes from
# the environment of that script; no secret is stored in this file.
jenkins:
  systemMessage: "UpSkill-AI CI server, configured from ci/jenkins/casc.yaml"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${CI_ADMIN_USER}"
          password: "${CI_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token (generated per run)"
              secret: "${SONAR_TOKEN}"

unclassified:
  location:
    url: "http://jenkins:8080/"
  # Name used by withSonarQubeEnv('SonarQube') in the Jenkinsfile.
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_HOST_URL}"
        credentialsId: "sonar-token"

tool:
  # Name used by tool 'SonarScanner' in the Jenkinsfile.
  sonarRunnerInstallation:
    installations:
      - name: "SonarScanner"
        home: "/opt/sonar-scanner"

jobs:
  # ci/run-pipeline.sh mounts a bare repository holding only the commit under
  # test at /src, on branch ci-build; build exactly that commit.
  - script: >
      pipelineJob('upskill-ai') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///src') }
                branch('${CI_COMMIT}')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
