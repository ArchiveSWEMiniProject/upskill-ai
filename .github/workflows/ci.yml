# Runs the repository's Jenkinsfile on a fresh Jenkins LTS server with its own
# SonarQube, for every pull request and every push to main. The pipeline itself
# (lint, tests, coverage, SonarQube gate, Docker build, deploy smoke test) lives
# in the Jenkinsfile; this workflow only provides the machine. See docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main (Monday 08:47 IST) so a new release of an unpinned
  # dependency or a vanished image is caught before it breaks someone's PR.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Runs on main
# (push, schedule, manual) each get their own group, so a quick second merge
# never cancels the first merge's run and every main commit gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  jenkins:
    # This name is the required status check on main.
    name: Jenkins pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Jenkinsfile on Jenkins LTS + SonarQube
        run: ci/run-pipeline.sh

      - name: Upload Jenkins log and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jenkins-build-${{ github.run_number }}
          path: ci-out/
          retention-days: 30
